<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volviendo a Art Of IA…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#07142B; color:#fff; font-family:system-ui, sans-serif; text-align:center; padding:24px; }
  a { display:inline-block; margin-top:20px; padding:16px 28px; border-radius:14px;
      background:#A6FA02; color:#07142B; font-weight:800; text-decoration:none; font-size:18px; }
  p { color:#B9C6DE; max-width:320px; line-height:1.5; }
</style>
</head>
<body>
<div>
  <h1>Conectado con Canva</h1>
  <p>Si la app no se abre sola, pulsa el botón.</p>
  <a id="volver" href="#">Volver a Art Of IA</a>
</div>
<script>
  // Reenvía el código de Canva a la app con el esquema artofia://
  var q = window.location.search;
  var esquema = 'artofia://canva' + q;
  var intento = 'intent://canva' + q + '#Intent;scheme=artofia;package=com.artofia.gestor;end';
  document.getElementById('volver').href = /Android/i.test(navigator.userAgent) ? intento : esquema;
  setTimeout(function () { window.location.href = document.getElementById('volver').href; }, 300);
</script>
</body>
</html>
